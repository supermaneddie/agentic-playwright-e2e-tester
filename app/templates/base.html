<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agentic Playwright E2E Tester{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ asset_version('app.css') }}">

  <script src="{{ url_for('static', path='app.js') }}?v={{ asset_version('app.js') }}" defer></script>

<body>

</html>
